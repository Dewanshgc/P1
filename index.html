<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ff">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>
    Dewansh is a good boy
  </h1>
  <main class="game-card">
    <header class="heading">
      <p class="eyebrow">A LITTLE FRIENDLY COMPETITION</p>
      <h1>Tic-Tac-Toe<span>.</span></h1>
      <p class="subtitle">Three in a row takes the round.</p>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="player-card active" id="player-x">
        <span class="player-mark mark-x">X</span>
        <span class="player-name">Player X</span>
        <strong class="player-score" id="score-x">0</strong>
      </div>
      <div class="score-divider" aria-hidden="true">:</div>
      <div class="player-card" id="player-o">
        <span class="player-mark mark-o">O</span>
        <span class="player-name">Player O</span>
        <strong class="player-score" id="score-o">0</strong>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Player X's turn</p>

    <div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board">
      <button class="cell" type="button" role="gridcell" aria-label="Top left, empty" data-index="0"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Top middle, empty" data-index="1"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Top right, empty" data-index="2"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Middle left, empty" data-index="3"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Center, empty" data-index="4"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Middle right, empty" data-index="5"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Bottom left, empty" data-index="6"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Bottom middle, empty" data-index="7"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Bottom right, empty" data-index="8"></button>
    </div>

    <button class="new-game" id="new-game" type="button">New game <span aria-hidden="true">↻</span></button>
    <p class="footer-note">Two players · One board · Good luck!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
